name: fitness_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter


  flutter_svg: ^2.2.3               
  cached_network_image: ^3.4.1      
  google_fonts: ^6.3.3              
  lottie: ^3.3.2                    
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1              
  equatable: ^2.0.7                 
  freezed_annotation: ^3.0.0   
  go_router: ^17.0.1 
  get_it: ^9.2.0                    
  injectable: ^2.7.1+4  
  dio: ^5.9.0                       
  retrofit: ^4.9.2   
  json_annotation: ^4.9.0  
  shared_preferences: ^2.5.4        
  flutter_secure_storage: ^10.0.0  
  fluttertoast: ^9.0.0  
  logger: ^2.6.2                    
  pretty_dio_logger: ^1.4.0         
  flutter_easyloading: ^3.0.5
  easy_localization: ^3.0.8
  wheel_slider: ^1.2.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  freezed: ^3.0.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.1
  flutter_gen_runner: ^5.9.0
  mockito: ^5.5.1
  test: ^1.26.2
  bloc_test: ^10.0.0

flutter:

  uses-material-design: true


  assets:
  - assets/images/
  - assets/icons/
  - assets/translations/

flutter_gen:
  output: lib/app/core/gen/
  integrations:
    lottie: true
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false

